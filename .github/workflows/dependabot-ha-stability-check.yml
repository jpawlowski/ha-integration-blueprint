name: Dependency Bot HA Stability Check

# Automatically closes Dependabot and Renovate PRs that bump pytest-homeassistant
# to a Home Assistant pre-release (alpha, beta, or RC).
# The bot opens a new PR once a stable HA release becomes available.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - requirements_test.txt

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-ha-stability:
    name: Skip if HA dependency is pre-release
    # Only run for dependency bot PRs — human PRs are never auto-closed
    if: contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write # comment on and close the Dependabot pull request
      contents: read # read requirements_test.txt from the PR branch
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check if HA dependency is a pre-release
        id: check
        run: |
          # pytest-homeassistant carries the Home Assistant version it pins; .postN or .devN is its own repackaging.
          PACKAGE=pytest-homeassistant
          PIN=$(grep -oP '^pytest-homeassistant==\K[^\s#]+' requirements_test.txt || true)
          HA_VERSION=$(sed -E 's/\.(post|dev)[0-9]+$//' <<<"${PIN}")
          if [[ -z "${PIN}" ]]; then
            # pytest-homeassistant-custom-component names its Home Assistant pin only in its PyPI metadata.
            PACKAGE=pytest-homeassistant-custom-component
            PIN=$(grep -oP '^pytest-homeassistant-custom-component==\K[^\s#]+' requirements_test.txt || true)
            if [[ -z "${PIN}" ]]; then
              echo "Neither test package found in requirements_test.txt — skipping"
              exit 0
            fi
            HA_VERSION=$(curl -sf "https://pypi.org/pypi/${PACKAGE}/${PIN}/json" \
              | jq -r '[.info.requires_dist[]? | select(startswith("homeassistant==")) | ltrimstr("homeassistant==")
                        | sub("\\s*;.*$"; "")][0] // empty' || true)
            if [[ -z "${HA_VERSION}" ]]; then
              echo "::warning::Could not determine the Home Assistant version for ${PACKAGE}==${PIN} — skipping"
              exit 0
            fi
          fi
          {
            echo "package=${PACKAGE}"
            echo "pin=${PIN}"
            echo "ha_version=${HA_VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "${PACKAGE}==${PIN} pins Home Assistant ${HA_VERSION}"

          # PEP 440 pre-release markers of Home Assistant: an optional separator and a, b or rc after a digit.
          if [[ "${HA_VERSION}" =~ [0-9][._-]?(a|b|rc)[0-9]+ ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "Pre-release detected — PR will be closed"
          else
            echo "Stable release — PR may proceed"
          fi

      - name: Close PR — HA pre-release dependency detected
        if: steps.check.outputs.is_prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HA_VERSION: ${{ steps.check.outputs.ha_version }}
          PACKAGE: ${{ steps.check.outputs.package }}
          PIN: ${{ steps.check.outputs.pin }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '## ⏸️ Skipping — Home Assistant pre-release dependency\n\n'
            printf '`%s==%s` pins **Home Assistant %s**, which is a pre-release version.\n\n' \
              "${PACKAGE}" "${PIN}" "${HA_VERSION}"
            printf 'This PR is automatically closed to avoid pinning the integration to a beta or\n'
            printf 'release-candidate build of Home Assistant. A new PR will follow once\n'
            printf 'a stable Home Assistant release is available.\n\n'
            printf '> To test against **%s** intentionally, reopen this PR manually.\n' "${HA_VERSION}"
          } > /tmp/pr-comment.md

          gh pr comment "${PR_NUMBER}" --body-file /tmp/pr-comment.md
          gh pr close "${PR_NUMBER}"
