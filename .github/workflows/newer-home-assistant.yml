name: Newer Home Assistant

# The Lint workflow tests the minimum version from hacs.json; this one runs the type check and the tests against the
# newest stable and beta release as an early warning. It never blocks a pull request.

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements*.txt"
      - "hacs.json"
      - "pyproject.toml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests on Home Assistant ${{ matrix.ha }}"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        ha: [latest, beta]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.11.9"

      - name: Resolve the Home Assistant version
        id: ha_version
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: |
          version=$(bash script/.lib/ha_version.sh)
          pinned=$(sed -n 's/^pytest-homeassistant==\([^[:space:]#]*\).*/\1/p' requirements_test.txt)
          pinned=${pinned%.post*}
          echo "HA_VERSION=${version}" >> "${GITHUB_OUTPUT}"
          # A tilde sorts a pre-release before its release; a beta older than the pin, as between trains, is skipped.
          key() { sed -E 's/(a|b|rc)([0-9]+)$/~\1\2/' <<<"$1"; }
          newest=$(printf '%s\n' "$(key "${pinned}")" "$(key "${version}")" | sort -V | tail -1)
          if [[ "${version}" == "${pinned}" || "${newest}" != "$(key "${version}")" ]]; then
            echo "Home Assistant ${version} is not newer than the pinned ${pinned}, which the Lint workflow tests" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache Home Assistant installation
        if: steps.ha_version.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/ha-venv
          key: ha-venv-${{ runner.os }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-${{ hashFiles('mise.toml', '.config/mise/conf.d/*.toml', '**/requirements*.txt') }}
          restore-keys: |
            ha-venv-${{ runner.os }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-

      # Bootstrap installs the pytest-homeassistant release that matches a Home Assistant version other than the pin.
      - name: Install requirements
        if: steps.ha_version.outputs.skip != 'true'
        env:
          HA_VERSION: ${{ steps.ha_version.outputs.HA_VERSION }}
        run: script/setup/bootstrap

      - name: Type check
        if: steps.ha_version.outputs.skip != 'true'
        run: script/type-check

      - name: Tests
        if: steps.ha_version.outputs.skip != 'true'
        run: script/test
